<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NeoRhythm Web</title>
<style>
:root{--bg:#0a0a18;--fg:#e8f0ff;--ac:#00e5ff;--pk:#ff2d95;--card:#16162c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.scr{padding:12px;max-width:760px;margin:auto}[hidden]{display:none!important}
h1{margin:6px 0;color:var(--ac);letter-spacing:2px}h2{margin:8px 0}
button,select,input:not([type=checkbox]){background:#22224a;color:var(--fg);border:1px solid #44a;border-radius:8px;padding:8px 12px;font:inherit}
button.p{background:var(--ac);color:#001;border:0;font-weight:700}button.k{background:var(--pk);border:0}
.card{background:var(--card);border-radius:12px;padding:10px;margin:8px 0}
.tag{font-size:11px;background:#334;padding:2px 6px;border-radius:6px;margin-right:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
canvas{width:100%;display:block;background:#000;touch-action:none}
.big{font-size:44px;font-weight:800;color:var(--ac)}label{display:block;margin:8px 0}
</style></head><body>

<div id="sel" class="scr"><h1>NeoRhythm Web</h1>
<div class="row"><button class="p" id="gen">＋ AI自動曲追加</button><button id="toSet">設定</button>
<select id="mode"><option>NORMAL</option><option>SURVIVAL</option><option>FOCUS</option></select><span id="st"></span></div>
<details class="card"><summary><b>＋ mp3曲を登録</b></summary>
<label>タイトル <input id="mt" type="text"></label><label>アーティスト <input id="ma" type="text"></label>
<label>BPM <input id="mb" type="number" step="0.01" style="width:100px"></label>
<label>1拍目の位置(秒) <input id="mo" type="number" step="0.001" value="0" style="width:100px"></label>
<label>mp3のURL(GitHub Pages推奨・保存されます) <input id="mu" type="text" style="width:100%" placeholder="audio/xxx.mp3"></label>
<label>またはファイル選択(今回の起動中のみ) <input id="mf" type="file" accept="audio/*"></label>
<button class="p" id="madd">登録</button></details>
<div id="list"></div></div>

<div id="play" class="scr" hidden style="padding:0"><canvas id="cv"></canvas></div>

<div id="res" class="scr" hidden><h2 id="rt"></h2><div class="big" id="dj"></div><div id="rs"></div>
<canvas id="gg" width="600" height="140"></canvas><div class="card" id="ana"></div>
<div class="row"><button class="p" id="again">もう一度</button><button class="k" id="prac">苦手レーン練習譜面</button><button id="back">曲選択へ</button></div></div>

<div id="set" class="scr" hidden><h2>設定</h2>
<label>判定調整 (ms, +で遅く判定) <input type="number" id="off" step="5" style="width:90px"></label>
<label><input type="checkbox" id="bg"> 背景演出</label>
<label><input type="checkbox" id="auto"> AI自動曲追加</label>
<label><input type="checkbox" id="ana2"> プレイスタイル分析</label>
<label>GAS API のURL(空欄ならこのブラウザ内に保存) <input id="gu" type="text" style="width:100%" placeholder="https://script.google.com/macros/s/.../exec"></label>
<label>合言葉 <input id="gt" type="text"></label><div style="opacity:.6">URLや合言葉を変えたら、保存後にページを再読み込みしてください</div>
<div>キーコンフィグ (押して変更) / スマホは画面タップ</div><div class="row" id="keys"></div>
<div class="row"><button class="p" id="sback">戻る</button></div></div>

<script>
const $=s=>document.querySelector(s),DK=['ShiftLeft','KeyS','KeyD','KeyF','Space','KeyJ','KeyK','KeyL'];
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const api=async(fn,arg)=>{const u=S.set.url;if(!u)return null;try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn,arg,token:S.set.token})});const j=await r.json();return j.ok?j.data:null}catch(e){return null}};
const S={songs:[],logs:[],fav:LS('nr_fav')||[],set:Object.assign({off:0,keys:DK.slice(),bg:1,auto:1,ana:1,url:'',token:''},LS('nr_set')||{})};
const show=id=>document.querySelectorAll('.scr').forEach(e=>e.hidden=e.id!==id);
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const SEC=[.12,.35,.5,.68,.8,1.01],DEN=[.3,.5,.75,1,.2,1.1],NM=['Nova','Pulse','Vortex','Aether','Quasar','Helix','Zenith'];
const secOf=f=>SEC.findIndex(x=>f<x);
let AC,G=null,cv,bufs={},lastP=null,cur={};

/* ---------- AI自動曲追加 (ローカル生成エンジン; 外部AI APIに差替え可) ---------- */
function learnBpm(){const l=S.logs.filter(x=>x.rate>.5);if(!l.length)return 0;let a=0,b=0;l.forEach(x=>{a+=x.bpm*x.rate;b+=x.rate});return Math.round(a/b+(Math.random()*10-5))}
function genSong(){const seed=Math.floor(Math.random()*1e9),r=rng(seed),bpm=learnBpm()||135+Math.floor(r()*31);
 return{id:'ai_'+seed.toString(36),title:NM[seed%7]+' '+NM[(seed>>3)%7]+' '+seed%100,artist:'AI Composer',bpm:Math.max(135,Math.min(165,bpm)),
 duration:60+Math.floor(r()*31),seed,tags:['AI','Trance','Auto'],audioUrl:'',added:Date.now()}}
function genChart(s,diff,w){const r=rng(s.seed+({NORMAL:1,HYPER:7,PRACTICE:13}[diff]||1)),u=60/s.bpm/4,d={NORMAL:.55,HYPER:.9,PRACTICE:.75}[diff]||.6,notes=[];let last=-1;
 w=w||[0,1,1,1,1,1,1,1];
 for(let st=16;st*u<s.duration-2;st++){const f=st*u/s.duration,sec=secOf(f),den=DEN[sec]*d,hi=sec===3||sec===5;
  let p=st%4===0?den+.25:st%2===0?den*.6:hi?den*.35:0;if(r()>=p)continue;
  let lane;if(st%16===0&&r()<.3*d)lane=0;else{const t=w.slice(1).reduce((a,b)=>a+b,0);let x=r()*t;lane=1;for(let i=1;i<8;i++){x-=w[i];if(x<=0){lane=i;break}}if(lane===last)lane=lane%7+1}
  last=lane;notes.push({time:+(st*u+(s.offset||0)).toFixed(3),lane})}
 return{songId:s.id,difficulty:diff,level:Math.max(1,Math.min(12,Math.round(notes.length/s.duration/1.5))),notes}}
async function getBuf(s){if(bufs[s.id])return bufs[s.id];
 if(s.audioUrl){try{const r=await fetch(s.audioUrl);if(!r.ok)throw 0;return bufs[s.id]=await AC.decodeAudioData(await r.arrayBuffer())}catch(e){$('#st').textContent='mp3を読み込めません(URL・CORSを確認)';throw e}}
 if(s.local)throw new Error('local');
 const R=22050,c=new OfflineAudioContext(1,R*s.duration,R),r=rng(s.seed+99),spb=60/s.bpm,root=55*Math.pow(2,(s.seed%7)/12),
 pat=[0,0,3,0,5,0,7,3],sc=[0,3,5,7,10,12,15],nb=c.createBuffer(1,R,R),nd=nb.getChannelData(0);for(let i=0;i<R;i++)nd[i]=r()*2-1;
 const env=(o,t,d,v)=>{const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)};
 const osc=(ty,f,t,d,v)=>{const o=c.createOscillator();o.type=ty;o.frequency.value=f;env(o,t,d,v)},
 nz=(t,d,v)=>{const o=c.createBufferSource();o.buffer=nb;env(o,t,d,v)};
 for(let b=0;b*spb<s.duration-.3;b++){const t=b*spb,sec=secOf(t/s.duration);
  if(sec!==4){const o=c.createOscillator();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);env(o,t,.25,.9)}
  nz(t+spb/2,.05,.12);if(sec===2)for(let k=0;k<4;k++)nz(t+k*spb/4,.04,.05+.15*(t/s.duration-.35)*6);
  for(let k=0;k<2;k++)if(sec!==4||b%2===0)osc('sawtooth',root*Math.pow(2,pat[(b*2+k)%8]/12),t+k*spb/2,spb/2*.9,.2);
  if(sec===3||sec===5||sec===1)for(let k=0;k<4;k++)osc('triangle',root*4*Math.pow(2,sc[(b*4+k*3+(sec===3?0:2))%7]/12),t+k*spb/4,spb/4,sec===1?.05:.1)}
 return bufs[s.id]=await c.startRendering()}

/* ---------- 曲選択 ---------- */
async function addSong(){const s=genSong();S.songs.unshift(s);persist();$('#st').textContent='生成: '+s.title;
 await api('saveSong',JSON.stringify(s));for(const d of['NORMAL','HYPER'])await api('saveChart',JSON.stringify(genChart(s,d)));renderList()}
function renderList(){$('#list').innerHTML=S.songs.map(s=>{const f=S.fav.includes(s.id),lv=d=>genChart(s,d).level;
 return`<div class="card"><b>${f?'★':'☆'} ${s.title}</b> <span style="opacity:.6">${s.artist}</span><div>BPM ${s.bpm} ・ ${s.duration}s ${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
 <div class="row"><button data-a="f" data-i="${s.id}">お気に入り</button><button data-a="v" data-i="${s.id}">試聴</button>
 <button class="p" data-a="p" data-i="${s.id}" data-d="NORMAL">NORMAL ☆${lv('NORMAL')}</button><button class="k" data-a="p" data-i="${s.id}" data-d="HYPER">HYPER ☆${lv('HYPER')}</button></div></div>`}).join('')}
$('#list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const s=S.songs.find(x=>x.id===b.dataset.i);AC=AC||new AudioContext();unlock();await AC.resume();
 if(b.dataset.a==='f'){S.fav=S.fav.includes(s.id)?S.fav.filter(x=>x!==s.id):[...S.fav,s.id];LS('nr_fav',S.fav);renderList()}
 if(b.dataset.a==='v'){$('#st').textContent='試聴準備中…';const bf=await getBuf(s),o=AC.createBufferSource();o.buffer=bf;o.connect(AC.destination);o.start(0,s.duration*.5,8);$('#st').textContent='試聴中 8秒'}
 if(b.dataset.a==='p'){$('#st').textContent='音源生成中…';start(s,b.dataset.d,$('#mode').value)}};
$('#gen').onclick=addSong;

/* ---------- スマホ音声ロック解除(iOSの消音スイッチ対策) ---------- */
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');a.play().catch(()=>{})}catch(e){}}
/* ---------- mp3登録 ---------- */
const persist=()=>LS('nr_songs',S.songs.filter(x=>!x.local));
$('#madd').onclick=async()=>{AC=AC||new AudioContext();const f=$('#mf').files[0],url=$('#mu').value.trim(),bpm=+$('#mb').value;
 if(!(bpm>=60&&bpm<=300)||(!f&&!url))return $('#st').textContent='BPM(60〜300)と、mp3のURLかファイルを入力してください';
 const id='mp3_'+Date.now().toString(36),s={id,title:$('#mt').value||'Untitled',artist:$('#ma').value||'-',bpm,offset:+$('#mo').value||0,audioUrl:f?'':url,seed:Math.floor(Math.random()*1e9),tags:['MP3'],added:Date.now(),local:f?1:0,duration:0};
 $('#st').textContent='読み込み中…';
 try{if(f)bufs[id]=await AC.decodeAudioData(await f.arrayBuffer());else await getBuf(s)}catch(e){return $('#st').textContent='mp3を読み込めませんでした'}
 s.duration=Math.floor(bufs[id].duration);S.songs.unshift(s);persist();
 if(!s.local){await api('saveSong',JSON.stringify(s));for(const d of['NORMAL','HYPER'])await api('saveChart',JSON.stringify(genChart(s,d)))}
 renderList();$('#st').textContent='登録しました: '+s.title+(s.local?'(今回のみ)':'')};

/* ---------- プレイ ---------- */
const now=()=>AC.currentTime-G.t0-S.set.off/1000;
async function start(song,diff,mode,w){AC=AC||new AudioContext();await AC.resume();cur={song,diff,mode};
 const bf=await getBuf(song),notes=genChart(song,diff,w).notes.map(n=>({...n,d:0})),N=notes.length,src=AC.createBufferSource();src.buffer=bf;src.connect(AC.destination);
 const t0=AC.currentTime+2;src.start(t0);
 G={song,diff,mode,notes,N,t0,src,g:80/N,gauge:mode==='SURVIVAL'?100:mode==='FOCUS'?50:20,hist:[],cnt:{PERFECT:0,GREAT:0,GOOD:0,BAD:0,MISS:0},combo:0,max:0,score:0,miss:Array(8).fill(0),diffs:[],fl:Array(8).fill(0),msg:'',mt:0,fail:false};
 show('play');cv=$('#cv');cv.width=Math.min(innerWidth,760);cv.height=Math.round(innerHeight*.92);requestAnimationFrame(loop)}
function judge(d){d=Math.abs(d);return d<=.0167?'PERFECT':d<=.0333?'GREAT':d<=.1167?'GOOD':d<=.25?'BAD':'MISS'}
function apply(j,l,d){const c=G.cnt,g=G.g,T={NORMAL:{PERFECT:g,GREAT:g,GOOD:g/2,BAD:-3,MISS:-5},SURVIVAL:{PERFECT:.15,GREAT:.15,GOOD:0,BAD:-4,MISS:-8},FOCUS:{PERFECT:g*1.2,GREAT:g*1.2,GOOD:-.5,BAD:-6,MISS:-9}};
 c[j]++;if(j==='MISS'||j==='BAD'){G.combo=0;G.miss[l]++}else{G.combo++;G.max=Math.max(G.max,G.combo)}
 const bonus=G.mode==='FOCUS'&&G.gauge>=70?1.5:1;G.score+=Math.round({PERFECT:100,GREAT:70,GOOD:30,BAD:0,MISS:0}[j]*bonus);
 G.gauge=Math.max(0,Math.min(100,G.gauge+T[G.mode][j]));G.hist.push(G.gauge);G.msg=j;G.mt=performance.now();G.fl[l]=1;if(j!=='MISS')G.diffs.push(d);
 if(G.mode==='SURVIVAL'&&G.gauge<=0)G.fail=true}
function hit(l){if(!G||G.done)return;const t=now();let b=null;G.fl[l]=.6;
 for(const n of G.notes){if(n.time-t>.25)break;if(!n.d&&n.lane===l){const d=t-n.time;if(Math.abs(d)<=.25&&(!b||Math.abs(d)<Math.abs(b.d)))b={n,d}}}
 if(b){b.n.d=1;apply(judge(b.d),l,b.d)}}
function loop(){if(!G)return;const t=now();for(const n of G.notes)if(!n.d&&t-n.time>.25){n.d=1;apply('MISS',n.lane,0)}
 draw(t);if(G.fail||t>G.song.duration+1.5)return end();requestAnimationFrame(loop)}
function draw(t){const c=cv.getContext('2d'),W=cv.width,H=cv.height,lw=W/8,jy=H*.82,sp=jy/1.1,s=G.song;
 const pul=Math.max(0,1-((Math.max(t,0)*s.bpm/60)%1)*3);c.fillStyle=S.set.bg?`hsl(${(t*20+240)%360},50%,${5+5*pul}%)`:'#050510';c.fillRect(0,0,W,H);
 for(let l=0;l<8;l++){const x=l*lw,m=Math.min(.55,G.miss[l]*.05);c.fillStyle=`rgba(255,40,40,${m})`;c.fillRect(x,0,lw,H); // AIヒートマップ
  if(G.fl[l]>0){c.fillStyle=`rgba(0,229,255,${G.fl[l]*.35})`;c.fillRect(x,0,lw,H);G.fl[l]-=.06}
  c.strokeStyle='#335';c.strokeRect(x,0,lw,H)}
 for(const n of G.notes){if(n.d)continue;const y=jy-(n.time-t)*sp;if(y<-20||y>H)continue;c.fillStyle=n.lane===0?'#ff2d95':n.lane%2?'#e8f0ff':'#00e5ff';c.fillRect(n.lane*lw+3,y-7,lw-6,14)}
 c.fillStyle='#ff0';c.fillRect(0,jy,W,3);
 const gc=G.mode==='NORMAL'?(G.gauge>=80?'#0f8':'#f55'):G.mode==='SURVIVAL'?'#f80':G.gauge>=70?'#fd0':'#0cf';c.fillStyle='#222';c.fillRect(0,0,W,12);c.fillStyle=gc;c.fillRect(0,0,W*G.gauge/100,12);
 c.fillStyle='#fff';c.font='bold 14px system-ui';c.textAlign='left';c.fillText(`${G.mode} ${Math.round(G.gauge)}%${G.mode==='FOCUS'&&G.gauge>=70?' ★精度ボーナス×1.5':''}`,6,28);c.textAlign='right';c.fillText('SCORE '+G.score,W-6,28);
 c.textAlign='center';if(G.combo>1){c.font='bold 36px system-ui';c.fillStyle='#fff';c.fillText(G.combo,W/2,H*.4)}
 if(performance.now()-G.mt<500){c.font='bold 24px system-ui';c.fillStyle={PERFECT:'#0ff',GREAT:'#ff0',GOOD:'#0f8',BAD:'#f80',MISS:'#f33'}[G.msg];c.fillText(G.msg,W/2,H*.5)}
 if(t<0){c.fillStyle='#fff';c.font='20px system-ui';c.fillText('READY '+Math.ceil(-t),W/2,H*.3)}}
addEventListener('keydown',e=>{if(e.repeat)return;const l=S.set.keys.indexOf(e.code);if(G&&l>=0){e.preventDefault();hit(l)}});
$('#cv').addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();hit(Math.min(7,Math.floor((e.clientX-r.left)/r.width*8)))});

/* ---------- リザルト & プレイログ解析 ---------- */
function end(){G.done=true;try{G.src.stop()}catch(e){}const c=G.cnt,ex=2*c.PERFECT+c.GREAT,r=ex/(2*G.N),
 dj=r>=8/9?'AAA':r>=7/9?'AA':r>=6/9?'A':r>=5/9?'B':r>=4/9?'C':r>=3/9?'D':r>=2/9?'E':'F',
 ok=!G.fail&&(G.mode==='NORMAL'?G.gauge>=80:G.mode==='FOCUS'?G.gauge>=50:true);
 $('#rt').textContent=`${G.song.title} [${G.diff}/${G.mode}] ${ok?'CLEARED':'FAILED'}`;$('#dj').textContent='DJ LEVEL '+dj;
 $('#rs').innerHTML=`EX ${ex} / ${2*G.N} (${(r*100).toFixed(1)}%) ・ SCORE ${G.score} ・ MAX COMBO ${G.max}<br>`+Object.entries(c).map(([k,v])=>k+' '+v).join(' ・ ');
 const g=$('#gg').getContext('2d'),W=600,H=140;g.fillStyle='#000';g.fillRect(0,0,W,H);g.strokeStyle='#0ff';g.beginPath();G.hist.forEach((v,i)=>{const x=i/Math.max(1,G.hist.length-1)*W,y=H-v/100*H;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
 const mx=Math.max(1,...G.miss);G.miss.forEach((m,i)=>{g.fillStyle=`rgba(255,50,50,${.2+.8*m/mx})`;g.fillRect(i*W/8+4,H-10,W/8-8,8)});
 const avg=G.diffs.length?G.diffs.reduce((a,b)=>a+b,0)/G.diffs.length*1000:0,wl=G.miss.indexOf(mx),nm=['スクラッチ',...[1,2,3,4,5,6,7].map(i=>i+'鍵')];
 let m=[];if(Math.abs(avg)>6)m.push(`全体的に${avg>0?'遅め':'早め'}です(平均${avg.toFixed(1)}ms)。判定調整を${avg>0?'-':'+'}${Math.round(Math.abs(avg))}ms 程度に。`);else m.push('タイミングは安定しています。');
 if(mx>2)m.push(`ミスは${nm[wl]}レーンに集中(${mx}回)。練習譜面で強化しましょう。`);if(ok&&r<.85)m.push('GREAT以下を減らすとAA以上が狙えます。');
 $('#ana').hidden=!S.set.ana;$('#ana').innerHTML='<b>AIプレイ分析</b><br>'+m.join('<br>');
 lastP=G.miss.map(v=>1+v*3/mx);const log={at:Date.now(),songId:G.song.id,bpm:G.song.bpm,diff:G.diff,mode:G.mode,ex,rate:r,miss:G.miss};
 S.logs.push(log);LS('nr_logs',S.logs.slice(-200));api('saveLog',JSON.stringify(log));G=null;show('res')}
$('#again').onclick=()=>start(cur.song,cur.diff,cur.mode);$('#back').onclick=()=>show('sel');
$('#prac').onclick=()=>start(cur.song,'PRACTICE',cur.mode,[0,...lastP.slice(1)]);

/* ---------- 設定 ---------- */
function renderSet(){$('#off').value=S.set.off;$('#gu').value=S.set.url;$('#gt').value=S.set.token;$('#bg').checked=!!S.set.bg;$('#auto').checked=!!S.set.auto;$('#ana2').checked=!!S.set.ana;
 $('#keys').innerHTML=S.set.keys.map((k,i)=>`<button data-k="${i}">${i?i+'鍵':'SCR'}: ${k}</button>`).join('')}
$('#keys').onclick=e=>{const i=e.target.dataset.k;if(i==null)return;e.target.textContent='…押して';const f=ev=>{ev.preventDefault();S.set.keys[i]=ev.code;removeEventListener('keydown',f,true);renderSet()};addEventListener('keydown',f,true)};
$('#toSet').onclick=()=>{renderSet();show('set')};
$('#sback').onclick=()=>{S.set.off=+$('#off').value||0;S.set.url=$('#gu').value.trim();S.set.token=$('#gt').value.trim();S.set.bg=+$('#bg').checked;S.set.auto=+$('#auto').checked;S.set.ana=+$('#ana2').checked;LS('nr_set',S.set);show('sel')};

/* ---------- 起動 ---------- */
(async()=>{S.logs=LS('nr_logs')||[];const r=await api('getSongs');S.songs=r&&r.length?r.map(JSON.parse).reverse():(LS('nr_songs')||[]);
 if(S.set.auto&&!S.songs.length)await addSong();renderList();show('sel')})();
</script></body></html>
